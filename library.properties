name=TinyGFX
version=0.0.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=Small Arduino-first graphics library for SPI and I2C displays.
paragraph=A familiar GFX-style drawing API built on standard Arduino interfaces, sized to fit MCUs with very little flash and RAM. Bus, Panel and font format are separated, so the same drawing code runs over software SPI, hardware SPI or I2C, on a colour TFT or a monochrome OLED. No framebuffer is required, nothing is allocated dynamically, and anything you do not call is not linked in - including font formats you do not use.
category=Display
url=https://github.com/tanakamasayuki/TinyGFX
architectures=*
includes=TinyGFX.h
