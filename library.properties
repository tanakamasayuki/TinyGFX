name=TinyGFX
version=0.0.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=Small Arduino-first graphics library for SPI displays.
paragraph=A familiar GFX-style drawing API built on standard Arduino interfaces, sized to fit MCUs with very little flash and RAM. Panel and Bus are separated so the same sketch runs on CH32V, ESP32 and others, and optional MCU-specific fast backends can be dropped in. No framebuffer, no dynamic allocation, and features you do not call are not linked in.
category=Display
