name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize arduino-cli
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/ch32-riscv-ug/arduino_core_ch32_riscv_arduino/main/package_ch32-riscv-arduino.json
          arduino-cli config add board_manager.additional_urls \
            https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
          arduino-cli core update-index

      # ホスト実行。Tier 1（描画の正しさ）はこのコアが要る。
      - name: Install host core
        run: arduino-cli core install lang-ship:host

      # 基準機。Tier 0（footprint / linkprune）はこのコアが要る。
      # 取れなくてもジョブは続ける（テスト側が skip する）。
      - name: Install CH32 RISC-V core
        continue-on-error: true
        run: arduino-cli core install ch32-riscv-arduino:ch32riscv

      # Tier 2（examples のビルド）用。esp32 は重いので CI では入れない
      # （build_matrix の esp32 ケースは skip される）。
      - name: Install AVR core
        continue-on-error: true
        run: arduino-cli core install arduino:avr

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        working-directory: tests
        run: uv sync

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # フォントは LGFXFontToolJs の CLI が出したものをそのままコミットしている。
      # ここでは書き換えず --check で照合するだけ（不一致なら終了コード 2）。
      #
      # **`npx -p lgfx-font-tool lgfx-font` と書くこと。** パッケージ名とコマンド名が
      # 違うので、素の `npx lgfx-font` は環境によって 404 になる。
      #
      # 使うのは同梱ビットマップフォントだけなので、npm 以外の外部取得は無い。
      # tests/clifont/ は --google（Google Fonts の取得）なので CI からは外してある。
      # 中身はテストが毎回描いて検査しているが、「いま CLI が同じものを出すか」までは見ない。
      - name: Check the generated fonts are current
        shell: bash
        run: |
          set -euo pipefail
          chk() {
            npx --yes -p lgfx-font-tool lgfx-font build \
              --font lgfxJapanGothic_8 --format cellfont --check "$@"
          }
          F=tests/common_libs/tgfx_font/src
          chk --sets digits                          --name tgfxDigits       --out "$F/tgfx_digits.h"
          chk --sets digits --chars "℃"              --name tgfxDigitsChain  --out "$F/tgfx_digits_chain.h"
          chk --sets digits --chars "℃" --max-chain 1 --name tgfxDigitsSparse --out "$F/tgfx_digits_sparse.h"
          chk --sets ascii                           --name tgfxAscii        --out "$F/tgfx_ascii.h"
          for d in examples/HelloWorld examples/OledI2C examples/M5StackBasic tests/manual/m5stack; do
            chk --sets digits --chars ":. " --name tgfxClock --out "$d/tgfx_clock.h"
          done

      - name: Run pytest
        working-directory: tests
        run: uv run pytest -v -s --html=report.html --self-contained-html

      # フットプリントの増分をプルリクから見えるようにする
      - name: Footprint summary
        if: always()
        working-directory: tests
        run: |
          {
            echo '## Footprint (CH32V003)'
            echo '```'
            uv run pytest footprint -s -q 2>/dev/null | sed -n '/構成/,/^p2/p' || echo 'not measured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            tests/report.html
            tests/**/output/**
          if-no-files-found: ignore
