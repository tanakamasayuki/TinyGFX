name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Initialize arduino-cli
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/ch32-riscv-ug/arduino_core_ch32_riscv_arduino/main/package_ch32-riscv-arduino.json
          arduino-cli config add board_manager.additional_urls \
            https://tanakamasayuki.github.io/lang-ship-arduino-core/package_lang-ship_index.json
          arduino-cli core update-index

      # ホスト実行。Tier 1（描画の正しさ）はこのコアが要る。
      - name: Install host core
        run: arduino-cli core install lang-ship:host

      # 基準機。Tier 0（footprint / linkprune）はこのコアが要る。
      # 取れなくてもジョブは続ける（テスト側が skip する）。
      - name: Install CH32 RISC-V core
        continue-on-error: true
        run: arduino-cli core install ch32-riscv-arduino:ch32riscv

      # Tier 2（examples のビルド）用。esp32 は重いので CI では入れない
      # （build_matrix の esp32 ケースは skip される）。
      - name: Install AVR core
        continue-on-error: true
        run: arduino-cli core install arduino:avr

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        working-directory: tests
        run: uv sync

      - name: Check the generated font is current
        run: |
          python3 tools/gen_font.py
          git diff --exit-code tests/common_libs/tgfx_font/

      - name: Run pytest
        working-directory: tests
        run: uv run pytest -v -s --html=report.html --self-contained-html

      # フットプリントの増分をプルリクから見えるようにする
      - name: Footprint summary
        if: always()
        working-directory: tests
        run: |
          {
            echo '## Footprint (CH32V003)'
            echo '```'
            uv run pytest footprint -s -q 2>/dev/null | sed -n '/構成/,/^p2/p' || echo 'not measured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            tests/report.html
            tests/**/output/**
          if-no-files-found: ignore
